<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Paciente</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/3.1_cadastro_de_pacientes.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="ico/favicon.ico" type="image/x-icon">
</head>
<body>

<div class="container">

    <!-- MENU LATERAL -->
    <aside class="sidebar">
        <h1 class="logo">Sistema</h1>

        <nav>
            <a href="1_login.html">Início</a>
            <a href="3_perfil_recepcionista_pacientes.html">Lista de Pacientes</a>
            <a href="#" class="active">Novo Cadastro</a>
        </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="content">

        <form id="formPaciente">

           <!-- BOTÃO VOLTAR -->
<div class="top-buttons">
    <button type="button" id="btnVoltar" class="btn-voltar">← Voltar</button>
</div>

<h2>Cadastro de Paciente</h2>

            <p class="subtitle">
                Preencha os dados abaixo para registrar um novo paciente.
            </p>

            <!-- DADOS PESSOAIS -->
            <section class="card">
                <h3>Dados Pessoais</h3>

                <div class="grid">
                    <div>
                        <label>Nome Completo</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div>
                        <label>CPF</label>
                        <input type="text" id="cpf" required>
                    </div>

                    <div>
                        <label>Data de Nascimento</label>
                        <input type="date" id="dataNascimento" required>
                    </div>

                    <div>
                        <label>Sexo Biológico</label>
                        <select id="sexo">
                            <option>Feminino</option>
                            <option>Masculino</option>
                        </select>
                    </div>

                    <div>
                        <label>Telefone</label>
                        <input type="tel" id="telefone">
                    </div>

                    <div>
                        <label>E-mail</label>
                        <input type="email" id="email">
                    </div>
                </div>
            </section>

            <!-- DADOS CLÍNICOS -->
            <section class="card">
                <h4>Dados Clínicos</h4>

                <div class="grid">
                    <div>
                        <label>Hospital / Unidade</label>
                        <select id="hospital">
                            <option>Hospital Santa Helena</option>
                            <option>Clínica Radiológica Vida</option>
                            <option>Outros Hospitais</option>
                        </select>
                    </div>

                    <div>
                        <label>Médico Solicitante</label>
                        <input type="text" id="medico">
                    </div>

                    <div>
                        <label>Tipo de Exame</label>
                        <select id="tipoExame">
                            <option>Mamografia Digital</option>
                            <option>Tomossíntese</option>
                            <option>Ultrassonografia Mamária</option>
                        </select>
                    </div>

                    <!-- 🔥 NOVO CAMPO -->
                    <div>
                        <label>Data do Exame</label>
                        <input type="date" id="dataExame" required>
                    </div>

                    <div class="full">
                        <label>Observações Clínicas</label>
                        <textarea id="observacoes"></textarea>
                    </div>

                    <div class="full">
                        <label>Alergias</label>
                        <textarea id="alergias"></textarea>
                    </div>
                </div>
            </section>

            <!-- UPLOAD -->
            <section class="card upload">
                <h5>Imagem da Mamografia</h5>
                <input type="file" id="imagem">
            </section>

            <button class="btn" type="submit">Salvar Paciente</button>

        </form>

    </main>
</div>

<!-- JS -->
<script type="module" src="js/3.1_cadastro_de_paciente.js"></script>

</body>
</html>
