<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laudo Médico</title>
    <!-- Conectando o CSS -->
    <link rel="stylesheet" href="css/5_pagina_resultado_analise_ia.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="ico/favicon.ico" type="image/x-icon">
</head>
<body>

    <!-- Container principal -->
    <div class="app">

        <!-- Sidebar lateral --> 
        <aside class="sidebar">
            <div class="profile">
                <img src="img/img_medico.jpg" alt="Foto do médico">
                <div>
                    <strong>Dr. Roberto </strong>
                    <span>Mastologista</span>
                </div>
            </div>

            <nav class="menu">
             
                <a href="2_perfil_medico_pacientes.html" class="menu-item">Lista de Pacientes</a>
                <a href="4_pagina_analise_ia.html" class="menu-item ">Diagnóstico</a>
                <a href="5_pagina_resultado_analise_ia.html" class="menu-item active">Pré-visualização do Laudo</a>
                <a href="6_pagina_visualização_do_laudo.html" class="menu-item ">Laudo</a>
            </nav>

           <a href="1_login.html" class="logout-btn">Sair do Sistema</a>
           
        </aside>

        <!-- Conteúdo principal -->
        <main class="main-content">

            <!-- Cartão do hospital -->
            <section class="card">
                <header class="card-header">
                    <h2>Hospital Santa Cruz</h2>
                    <p>Departamento de Radiologia</p>
                </header>

                <!-- Dados do paciente -->
                <div class="patient-info">
                    <div>
                        <span class="label">Paciente</span>
                        <p>Maria Silva Oliveira</p>
                    </div>
                    <div>
                        <span class="label">ID do Paciente</span>
                        <p>849.201-55</p>
                    </div>
                </div>

                <!-- Texto do laudo -->
                <div class="report">
                    <span class="label">Texto do laudo</span>
                    <textarea readonly id="laudoTextarea"></textarea>

                </div>
            </section>

            <!-- Painel lateral direito -->
            <aside class="side-panel">
                <div class="status">
                    <span class="status-dot"></span>
                    <div>
                        <strong>Saudável</strong>
                        <p>Sem anomalias detectadas</p>
                    </div>
                </div>

                <img src="img/exame_momografia.jpg" alt="Imagem de mamografia" class="exam-image">

                <div class="actions">
                    <button class="btn secondary"> Feedback da Análise de IA</button>

                    <button id="pg_edicao_laudo" class="btn secondary">✏️ Editar laudo</button>

                    <button id="pg_validar_laudo" class="btn primary">✔️ Validar</button>
                </div>
            </aside>

        </main>
    </div>

    <!-- Conectando o JavaScript -->
    <script src="js/5_pagina_resultado_analise_ia.js"></script>
</body>
</html>
