<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MamoIA | Login</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="container">
        <div class="left">
            <div class="logo">
                <img src="img/logo-mamoia.png" alt="MamoIA">
            </div>

            <h1>Diagnóstico preciso,<br>
                <span>Segurança total.</span>
            </h1>

            <p>
                Ambiente seguro para mastologistas e profissionais de saúde.<br>
                Acesso restrito e monitorado.
            </p>
        </div>

        <div class="right">
            <form id="loginForm" class="login-box">
                <h2>Login</h2>
                <p>Insira suas credenciais para acessar o prontuário.</p>

                <label>Usuário</label>
                <input type="text" id="usuario" placeholder="Nome de usuário" required>

                <label>Senha</label>
                <input type="password" id="senha" placeholder="Senha" required>

                <button type="submit">Entrar</button>

                <a href="#">Cadastre-se agora</a>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
